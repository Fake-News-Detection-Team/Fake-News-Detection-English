<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English Fake News Detection</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
  <style>
    body{
      font-family: Arial, sans-serif;
      background-image: url("{{ url_for('static', filename='background.png') }}");
     
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .container{
      background:white;
      padding:30px;
      border-radius:20px;
      width:600px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      text-align:center;
    }
    h1{
      margin-bottom:20px;
      font-size:24px;
      color:#333;
    }
    select, textarea, button{
      width:100%;
      margin-top:15px;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      font-size:15px;
    }
    textarea{
      width:95.5%;
      resize:;
      height:150px;
    }
    button{
      background:#2a476d;
      color:white;
      border:none;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }
    button:hover{
      background:#23314d;
    }
    .result{
      margin-top:20px;
      font-size:18px;
      font-weight:bold;
      color:#222;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>ENGLISH FAKE NEWS DETECTION SYSTEM</h1>

  <select id="language">
    <option value="english">English</option>
  </select>

  <textarea id="newsText" maxlength="1000" placeholder="Enter News Heading + Article (Max ~1000 words)"></textarea>

  <button onclick="checkNews()">CHECK</button>

  <div class="result" id="result"></div>
</div>

<script>
async function checkNews(){
  const text = document.getElementById("newsText").value.trim();
  const lang = document.getElementById("language").value;

  if(text.length === 0){
    alert("Please enter news text");
    return;
  }

  document.getElementById("result").innerText = "Analyzing...";

  try{
    const response = await fetch("/predict", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ text:text, language:lang })
    });

    const data = await response.json();

    if (data.error) { 
      document.getElementById("result").innerText = "Backend Error: " + data.error;
    } 
    else {
      document.getElementById("result").innerText = `Prediction: ${data.prediction} (Confidence: ${data.confidence}%)`;
    }
  }catch(err){
    document.getElementById("result").innerText = "Error connecting to model backend";
  }
}
</script>

</body>
</html>
